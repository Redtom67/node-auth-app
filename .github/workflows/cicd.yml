# CI/CD: on every push to main, test the full stack, then build and push
# the frontend and backend images to Docker Hub.
# The name must stay exactly "CI/CD": deploy_server.py checks it.
name: CI/CD

on:
  push:
    branches: [main]

env:
  # One private repo on Docker Hub, the two images are told apart by their tag.
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/auth-app

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # ---------- 1. Tests (Playwright against the full stack) ----------
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start the stack (db, backend, frontend)
        run: docker compose up --build -d

      - name: Wait until the app and the API answer
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5173/api/health; then echo; echo "Stack is ready"; exit 0; fi
            sleep 2
          done
          echo "Stack did not start in time"; exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Show container logs (only if something failed)
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # ---------- 2. Build and push (only reached if the tests passed) ----------
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same Dockerfiles as docker-compose.yml: the layers are already cached
      # from the "Start the stack" step, so these builds are almost instant.
      - name: Build the images
        run: |
          docker build -t "$IMAGE:backend" ./backend
          docker build -t "$IMAGE:frontend" -f Dockerfile.multistage .

      - name: Push the images to Docker Hub
        run: |
          docker push "$IMAGE:backend"
          docker push "$IMAGE:frontend"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
